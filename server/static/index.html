<!doctype html>
<html lang="{lang}">
  <head>
    <title>{title}</title>
    <meta name="theme-color" content="#FFF" />
    <meta name="slack-app-id" content="{slack-app-id}" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="{description}" />
    <meta name="darkreader-lock" />
    {head-tags}
    <style>
      @font-face {
        font-family: "Inter";
        font-display: swap;
        font-feature-settings: "ss03", "cv05";
        src: url("{cdn-url}/fonts/Inter.var.woff2") format("woff2");
      }

      @font-face {
        font-family: "Inter";
        font-display: swap;
        font-feature-settings: "ss03", "cv05";
        font-style: italic;
        src: url("{cdn-url}/fonts/Inter-italic.var.woff2") format("woff2");
      }

      /* Apple SF Pro (UI) — variable, covers all weights */
      @font-face {
        font-family: "SF Pro";
        font-display: swap;
        font-weight: 100 900;
        src: url("{cdn-url}/fonts/SF-Pro.woff2") format("woff2");
      }
      @font-face {
        font-family: "SF Pro";
        font-display: swap;
        font-style: italic;
        font-weight: 100 900;
        src: url("{cdn-url}/fonts/SF-Pro-Italic.woff2") format("woff2");
      }

      /* Apple SF Mono (code) */
      @font-face {
        font-family: "SF Mono";
        font-display: swap;
        font-weight: 400;
        src: url("{cdn-url}/fonts/SF-Mono-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "SF Mono";
        font-display: swap;
        font-weight: 500;
        src: url("{cdn-url}/fonts/SF-Mono-Medium.woff2") format("woff2");
      }
      @font-face {
        font-family: "SF Mono";
        font-display: swap;
        font-weight: 600;
        src: url("{cdn-url}/fonts/SF-Mono-Semibold.woff2") format("woff2");
      }
      @font-face {
        font-family: "SF Mono";
        font-display: swap;
        font-weight: 700;
        src: url("{cdn-url}/fonts/SF-Mono-Bold.woff2") format("woff2");
      }

      body,
      html {
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        width: 100%;
        height: 100%;
      }

      @media print {
        body {
          display: block;
        }
      }

      #root {
        flex: 1;
        min-height: 100%;
        width: 100%;
      }

      .screenreader-only {
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }

      @media print {
        .screenreader-only {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    {env}
    <script nonce="{csp-nonce}">
      if (
        window.localStorage &&
        window.localStorage.getItem("theme") === "dark"
      ) {
        var color = "#0d1117";
        document.querySelector("#root").style.background = color;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", color);
      }
    </script>
    {script-tags}
    <div class="screenreader-only">{content}</div>
  </body>
</html>
